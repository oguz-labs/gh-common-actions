name: Run Robot Framework suite

# Reusable workflow: runs a target's install/lint/check/test commands and
# uploads the resulting results/ directory as a build artifact. `make` is
# NOT assumed — nothing in elastic-automation's onboarding convention
# (docs/ONBOARDING.md) guarantees a target even has a Makefile, so every
# step is a plain command string the caller controls. The defaults below
# match old-scout/tests/Makefile purely for convenience; a target built a
# different way (bare `robot` invocation, a different task runner, the
# Playwright case this library's publish-allure.yml already anticipates)
# overrides them.
#
# Nothing here is Allure-specific either — the suite itself has no idea an
# Allure listener exists unless the caller opts in via enable_allure, and
# generating a report is entirely publish-allure.yml's job (chain this
# workflow's allure_results_dir output into it). enable_allure works by
# exporting ROBOT_OPTIONS before test_command runs — it only has an effect
# if test_command's own tooling actually reads that env var, the way
# old-scout's Makefile does.
#
# lint_command/check_command are NOT generic Robot Framework concepts — do
# not assume every target has an equivalent:
#   - a "lint" step is commonly `robot --dryrun` (a real, built-in RF flag
#     that resolves keywords/syntax without executing) — worth running if
#     the target has an equivalent, skip it (leave the input empty) if not.
#   - a "check" step is elastic-automation-specific: a static test-intent
#     trace (docs/REGRESSION_REPLAY.md §6) that old-scout happens to expose
#     as `make check` — a target onboarded differently may have nothing
#     resembling it at all.
# Both are empty (skipped) by default.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label to execute on. Default self-hosted since the SUT is
          typically only reachable from inside the org network/cluster.
        type: string
        default: self-hosted
      working_directory:
        description: Directory (relative to repo root) to run all commands in.
        type: string
        default: tests
      sut_url:
        description: Base URL of the system under test. Passed through as SUT_URL; omit to use the target's own default.
        type: string
        default: ""
      bootstrap_command:
        description: Installs dependencies (deliberately no actions/setup-python — org convention on self-hosted runners is to use whatever python3 is baked into the runner image). Empty skips this step, e.g. for a target whose runner image already has everything baked in.
        type: string
        default: make bootstrap
      lint_command:
        description: Optional static-syntax check, e.g. `robot --dryrun`. Empty (default) skips this step.
        type: string
        default: ""
      check_command:
        description: Optional target-specific static check (e.g. elastic-automation's test-intent trace). Empty (default) skips this step.
        type: string
        default: ""
      test_command:
        description: Runs the suite and produces results/.
        type: string
        default: make run
      enable_allure:
        description: >-
          Export ROBOT_OPTIONS with `--listener allure_robotframework:<dir>`
          before test_command runs, and upload the resulting directory
          (fixed name `allure-results`) as an artifact, for chaining into
          publish-allure.yml. Only takes effect if test_command's own
          tooling reads ROBOT_OPTIONS. Off by default.
        type: boolean
        default: false
    outputs:
      allure_results_dir:
        description: Path to the generated Allure results directory, empty if enable_allure was false.
        value: ${{ jobs.test.outputs.allure_results_dir }}

jobs:
  test:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      SUT_URL: ${{ inputs.sut_url }}
      ENABLE_ALLURE: ${{ inputs.enable_allure }}
      ALLURE_RESULTS_DIR: allure-results
    outputs:
      allure_results_dir: ${{ inputs.enable_allure && format('{0}/allure-results', inputs.working_directory) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        if: ${{ inputs.bootstrap_command != '' }}
        run: ${{ inputs.bootstrap_command }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        run: ${{ inputs.lint_command }}

      - name: Static intent check
        if: ${{ inputs.check_command != '' }}
        run: ${{ inputs.check_command }}

      - name: Run suite
        run: |
          if [ "$ENABLE_ALLURE" = "true" ]; then
            export ROBOT_OPTIONS="${ROBOT_OPTIONS:+$ROBOT_OPTIONS }--listener allure_robotframework:$PWD/$ALLURE_RESULTS_DIR"
          fi
          ${{ inputs.test_command }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: ${{ inputs.working_directory }}/results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.enable_allure }}
        with:
          name: allure-results
          path: ${{ inputs.working_directory }}/allure-results
          if-no-files-found: warn
