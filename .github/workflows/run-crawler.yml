name: Run observer crawler

# Reusable workflow: runs elastic-automation's autonomous crawler
# (observer.crawler) against a target's SUT and produces this run's
# manifest.yaml + elastic-pom.yaml. Nothing else — no diff, no policy
# gate, no promotion. Diffing against a baseline and applying CI policy
# is observer.replay_cli's job, called separately by the caller; baseline
# promotion is a separate, human/TTL-authorized step.
#
# elastic-pom.yaml is durable, committed state (see
# oguz-labs/elastic-automation/docs/INTERACTIVE_OBSERVER.md §6) — this
# workflow writes it into bindings_dir inside the checkout, but does NOT
# commit or push it. That decision belongs to the caller.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label to execute on. Default self-hosted since the SUT is
          typically only reachable from inside the org network/cluster.
        type: string
        default: self-hosted
      sut_url:
        description: Base URL of the system under test to crawl.
        type: string
        required: true
      mode:
        description: >-
          'ci' (autonomous, never blocks — unreachable walls are marked,
          not fatal) or 'interactive' (currently behaves like 'ci' from
          this CLI — there's no wall_resolver wiring yet).
        type: string
        default: ci
      manifest_id:
        description: Manifest id this crawl publishes under (e.g. ui:<product>:<spec>).
        type: string
        required: true
      build_id:
        description: Build identity this crawl was taken against (a git SHA or image tag).
        type: string
        default: ${{ github.sha }}
      artifacts_dir:
        description: >-
          Where manifest.yaml lands, relative to the checkout — ephemeral,
          regenerated every run. Matches the target's own artifacts_dir
          from its .elastic-automation.yaml.
        type: string
        default: reports/artifacts
      bindings_dir:
        description: >-
          Where elastic-pom.yaml lands, relative to the checkout —
          durable, committed state (never the same directory as
          artifacts_dir). Matches the target's own bindings_dir.
        type: string
        default: tests/bindings
      seed_paths:
        description: >-
          Path (relative to the checkout) to an existing seed-paths.yaml,
          if the target has one. Leave empty if it doesn't yet.
        type: string
        default: ""
      engine_ref:
        description: >-
          elastic-automation tag or commit SHA to pin the engine to —
          never a moving branch (e.g. v0.2.0).
        type: string
        required: true
      upload_report:
        description: Upload manifest.yaml + elastic-pom.yaml as a build artifact.
        type: boolean
        default: true
      retention:
        description: Retention period for the artifact, in days.
        type: number
        default: 7
    outputs:
      manifest_path:
        description: Path (relative to the checkout) to this run's manifest.yaml.
        value: ${{ jobs.crawl.outputs.manifest_path }}
      elastic_pom_path:
        description: Path (relative to the checkout) to this run's elastic-pom.yaml.
        value: ${{ jobs.crawl.outputs.elastic_pom_path }}

jobs:
  crawl:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      manifest_path: ${{ steps.paths.outputs.manifest_path }}
      elastic_pom_path: ${{ steps.paths.outputs.elastic_pom_path }}
    env:
      SUT_URL: ${{ inputs.sut_url }}
      MODE: ${{ inputs.mode }}
      MANIFEST_ID: ${{ inputs.manifest_id }}
      BUILD_ID: ${{ inputs.build_id }}
      ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
      BINDINGS_DIR: ${{ inputs.bindings_dir }}
      SEED_PATHS: ${{ inputs.seed_paths }}
      ENGINE_REF: ${{ inputs.engine_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Install engine and browser binary
        run: |
          python3 -m pip install "git+https://github.com/oguz-labs/elastic-automation.git@${ENGINE_REF}#subdirectory=engine"
          python3 -m playwright install chromium

      - name: Compute output paths
        id: paths
        run: |
          safe_id=$(echo "$MANIFEST_ID" | tr ':' '_')
          echo "manifest_path=${ARTIFACTS_DIR}/${safe_id}.yaml" >> "$GITHUB_OUTPUT"
          echo "elastic_pom_path=${BINDINGS_DIR}/elastic-pom.yaml" >> "$GITHUB_OUTPUT"

      - name: Crawl
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          POM_PATH: ${{ steps.paths.outputs.elastic_pom_path }}
        run: |
          args=(
            "$SUT_URL"
            --mode "$MODE"
            --manifest-id "$MANIFEST_ID"
            --build-id "$BUILD_ID"
            --manifest-out "$MANIFEST_PATH"
            --pom-out "$POM_PATH"
          )
          if [ -n "$SEED_PATHS" ]; then
            args+=(--seed-paths "$SEED_PATHS")
          fi
          python3 -m observer.crawler "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.upload_report
        with:
          retention-days: ${{ inputs.retention }}
          name: crawler-output
          path: |
            ${{ steps.paths.outputs.manifest_path }}
            ${{ steps.paths.outputs.elastic_pom_path }}
          if-no-files-found: warn
