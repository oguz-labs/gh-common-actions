name: Run observer

# Reusable workflow: runs elastic-automation's autonomous crawler
# (observer.crawler) against a target's SUT and produces this run's
# manifest.yaml + elastic-pom.yaml as a plain build artifact. Nothing
# else — no diff, no policy gate, no checkin.
#
# This workflow has zero knowledge of the target's own directory layout
# (artifacts_dir/bindings_dir, durable vs ephemeral) or its commit
# conventions — that's the target's own concern, not the crawler's. It
# writes both output files to a workflow-local scratch directory and
# uploads them as one artifact; what the caller does with them —
# unpacking into bindings_dir, committing, opening a PR — is entirely up
# to that caller's own job/engineers.
#
# Comparing this run's output against a promoted baseline is a separate
# concern (observer.replay_cli), called by the caller in a later step —
# no shared workflow for that yet.
#
# Input descriptions below are kept short on purpose (GitHub's UI gives
# them little room) — see this comment block and the individual step
# comments for the full rationale.

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label. Default is the org's self-hosted pool.
        type: string
        default: kubernetes
      sut_url:
        description: Base URL of the system under test to crawl.
        type: string
        required: true
      mode:
        description: "'ci' (never blocks) or 'interactive' crawl mode."
        type: string
        default: ci
      build_id:
        description: Build/commit identity. Empty = this run's own SHA.
        type: string
        default: ""
      seed_paths:
        description: Path to an existing seed-paths.yaml, if any.
        type: string
        default: ""
      version:
        description: elastic-automation tag/SHA to pin (e.g. v0.2.1).
        type: string
        required: true
      artifact_name:
        description: Output artifact name; also this crawl's identity.
        type: string
        default: crawler-output
      retention:
        description: Artifact retention, in days.
        type: number
        default: 7
    outputs:
      artifact_name:
        description: Artifact name holding manifest.yaml + elastic-pom.yaml.
        value: ${{ inputs.artifact_name }}
  workflow_dispatch:
    # Same inputs as workflow_call, minus the outputs block (workflow_dispatch
    # doesn't support one) — lets a human trigger a one-off crawl manually
    # from the Actions UI/CLI without needing a caller workflow.
    # `retention` is `type: string` here, not `number` — workflow_dispatch
    # doesn't support that type. Defaults must be static values here (no
    # `${{ }}` expressions), including inside `description:` — GitHub
    # Actions expands `${{ }}` in any workflow string field, not just
    # run:/env:, so it can't even appear as documentation-in-backticks.
    inputs:
      runs_on:
        description: Runner label. Default is the org's self-hosted pool.
        type: string
        default: kubernetes
      sut_url:
        description: Base URL of the system under test to crawl.
        type: string
        required: true
      mode:
        description: "'ci' (never blocks) or 'interactive' crawl mode."
        type: string
        default: ci
      build_id:
        description: Build/commit identity. Empty = this run's own SHA.
        type: string
        default: ""
      seed_paths:
        description: Path to an existing seed-paths.yaml, if any.
        type: string
        default: ""
      version:
        description: elastic-automation tag/SHA to pin (e.g. v0.2.1).
        type: string
        required: true
      artifact_name:
        description: Output artifact name; also this crawl's identity.
        type: string
        default: crawler-output
      retention:
        description: Artifact retention, in days.
        type: string
        default: "7"

jobs:
  crawl:
    runs-on: ${{ inputs.runs_on }}
    env:
      SUT_URL: ${{ inputs.sut_url }}
      MODE: ${{ inputs.mode }}
      MANIFEST_ID: ${{ inputs.artifact_name }}
      BUILD_ID: ${{ inputs.build_id || github.sha }}
      SEED_PATHS: ${{ inputs.seed_paths }}
      VERSION: ${{ inputs.version }}
      OUT_DIR: _crawl-output
    steps:
      - uses: actions/checkout@v4

      - name: Install engine and browser binary
        # The org's runner image (oguz-labs/gh-runners) is being updated to
        # pre-bake Chromium so this doesn't re-download ~150MB every run —
        # `playwright install` is then a no-op on a matching version and
        # stays here only as a safety net against image/pin drift.
        run: |
          python3 -m pip install "git+https://github.com/oguz-labs/elastic-automation.git@${VERSION}#subdirectory=engine"
          python3 -m playwright install chromium

      - name: Crawl
        run: |
          mkdir -p "$OUT_DIR"
          args=(
            "$SUT_URL"
            --mode "$MODE"
            --manifest-id "$MANIFEST_ID"
            --build-id "$BUILD_ID"
            --manifest-out "${OUT_DIR}/manifest.yaml"
            --pom-out "${OUT_DIR}/elastic-pom.yaml"
          )
          if [ -n "$SEED_PATHS" ]; then
            args+=(--seed-paths "$SEED_PATHS")
          fi
          python3 -m observer.crawler "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ inputs.retention }}
          name: ${{ inputs.artifact_name }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
