name: Replay observer

# Reusable workflow: runs elastic-automation's observer.replay_cli against
# a downloaded crawl artifact (manifest.yaml + elastic-pom.yaml, from
# run-observer.yml or any job producing the same two files) and a target's
# promoted baseline directory. Computes the Process 2 map diff and applies
# the CI policy from
# oguz-labs/elastic-automation/docs/REGRESSION_REPLAY.md §7.
#
# This is comparison only — it never crawls (that's run-observer.yml) and
# never checks anything in (baseline_dir is read as-is from the checkout;
# promoting a new baseline is a separate, human/TTL-authorized step, not
# this workflow's job).
#
# `runs_on` defaults to GitHub-hosted (ubuntu-latest) — deliberately
# different from run-observer.yml's `kubernetes` default: this job never
# talks to the SUT, only to the checkout, a downloaded artifact, and pip.
#
# `artifact_name` doubles as this crawl's identity (matches
# run-observer.yml's `artifact_name` output) — pass the exact same value
# so this workflow finds the right subfolder under baseline_dir; there's
# only ever one name to keep in sync, not two.
#
# Input descriptions below are kept short on purpose (GitHub's UI gives
# them little room) — see this comment block for the full rationale.

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label. Default is GitHub-hosted.
        type: string
        default: ubuntu-latest
      artifact_name:
        description: Crawl artifact name (run-observer.yml's output).
        type: string
        required: true
      baseline_dir:
        description: Target's promoted baseline dir, relative to checkout.
        type: string
        required: true
      version:
        description: elastic-automation tag/SHA to pin (e.g. v0.2.1).
        type: string
        required: true
  workflow_dispatch:
    # Same inputs as workflow_call — lets a human manually replay an
    # already-uploaded crawl artifact (e.g. re-checking against a
    # different baseline_dir) from the Actions UI/CLI without a caller
    # workflow. The artifact must already exist (from a prior
    # run-observer.yml run in this repo) — this workflow never crawls.
    inputs:
      runs_on:
        description: Runner label. Default is GitHub-hosted.
        type: string
        default: ubuntu-latest
      artifact_name:
        description: Crawl artifact name (run-observer.yml's output).
        type: string
        required: true
      baseline_dir:
        description: Target's promoted baseline dir, relative to checkout.
        type: string
        required: true
      version:
        description: elastic-automation tag/SHA to pin (e.g. v0.2.1).
        type: string
        required: true

jobs:
  replay:
    runs-on: ${{ inputs.runs_on }}
    env:
      MANIFEST_ID: ${{ inputs.artifact_name }}
      BASELINE_DIR: ${{ inputs.baseline_dir }}
      VERSION: ${{ inputs.version }}
      RUN_DIR: _replay-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.RUN_DIR }}

      - name: Install engine
        run: python3 -m pip install "git+https://github.com/oguz-labs/elastic-automation.git@${VERSION}#subdirectory=engine"

      - name: Replay
        run: |
          python3 -m observer.replay_cli \
            --manifest "${RUN_DIR}/manifest.yaml" \
            --elastic-pom "${RUN_DIR}/elastic-pom.yaml" \
            --baseline-dir "$BASELINE_DIR" \
            --manifest-id "$MANIFEST_ID" \
            --report-out "${RUN_DIR}/report.md"

      - name: Post report to job summary
        if: always()
        run: |
          if [ -f "${RUN_DIR}/report.md" ]; then
            cat "${RUN_DIR}/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
